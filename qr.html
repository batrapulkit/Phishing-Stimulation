<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Phish: Webinar QR Code</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0f17;color:#e6ebf5;font-family:Inter,system-ui,sans-serif}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;background:radial-gradient(900px 500px at 50% -10%,rgba(124,92,255,.18),transparent 60%)}
.kicker{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.15em;text-transform:uppercase;color:#f5a524;margin-bottom:10px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.05;margin:0 0 10px;letter-spacing:-.03em}
.sub{font-size:clamp(16px,2.2vw,22px);color:#8b96ad;margin:0 0 28px}
.qrbox{background:#fff;padding:22px;border-radius:24px;box-shadow:0 20px 60px rgba(79,140,255,.25)}
#qr img,#qr canvas{display:block;width:min(56vh,80vw)!important;height:auto!important;image-rendering:pixelated}
.steps{display:flex;gap:28px;margin-top:28px;font-size:clamp(15px,1.8vw,19px);color:#c7cfdf;flex-wrap:wrap;justify-content:center}
.steps b{color:#4f8cff}
.ctrl{max-width:720px;margin:0 auto;padding:22px 20px 40px;border-top:1px solid #26314a}
.ctrl label{font-size:13px;color:#8b96ad;display:block;margin-bottom:6px}
.ctrl .row{display:flex;gap:8px}
.ctrl input{flex:1;min-width:0;background:#121826;border:1px solid #26314a;color:#e6ebf5;border-radius:10px;padding:12px;font:14px 'JetBrains Mono',monospace}
.ctrl button{border:0;border-radius:10px;padding:12px 16px;font:600 14px Inter;background:linear-gradient(135deg,#4f8cff,#7c5cff);color:#fff;cursor:pointer}
.ctrl p{font-size:13px;color:#8b96ad;margin:10px 0 0}
</style>
</head>
<body>
<div class="stage">
  <div class="kicker">Live challenge</div>
  <h1>Can you Spot the Phish?</h1>
  <p class="sub">10 emails. Some are attacks. Scan to play on your phone.</p>
  <div class="qrbox"><div id="qr"></div></div>
  <div class="steps"><span><b>1.</b> Open your camera</span><span><b>2.</b> Scan the code</span><span><b>3.</b> Phishing or Legit?</span></div>
</div>
<div class="ctrl">
  <label for="u">Link the QR code opens (auto-filled with this website's address)</label>
  <div class="row"><input id="u" value=""><button id="go">Update QR</button><button id="dl">Download PNG</button></div>
  <p>Use "Download PNG" for your slides, or show this page full screen. Test-scan with your phone before the webinar.</p>
</div>
<script>
const box = document.getElementById("qr"), input = document.getElementById("u");
function draw(){
  box.innerHTML = "";
  try{ new QRCode(box,{text:input.value.trim(),width:512,height:512,colorDark:"#0b0f17",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ box.innerHTML = '<p style="color:#111;padding:40px">QR library did not load. Refresh the page.</p>'; }
}
document.getElementById("go").onclick = draw;
input.addEventListener("keydown", e=>{ if(e.key==="Enter") draw(); });
input.value = location.protocol.startsWith("http") ? location.origin + location.pathname.replace(/qr\.html$/,"") : "https://your-site.example/";
document.getElementById("dl").onclick = ()=>{
  const c = box.querySelector("canvas"); if(!c) return;
  const out = document.createElement("canvas"); const pad = 48; out.width = c.width + pad*2; out.height = c.height + pad*2;
  const x = out.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,out.width,out.height); x.drawImage(c,pad,pad);
  const a = document.createElement("a"); a.download = "spot-the-phish-qr.png"; a.href = out.toDataURL("image/png"); a.click();
};
window.addEventListener("load", draw);
</script>
</body>
</html>
